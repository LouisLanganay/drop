<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drop admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23F4F4F5' d='M12 2.5C12 2.5 5 10.1 5 14.7a7 7 0 0 0 14 0C19 10.1 12 2.5 12 2.5Z'/%3E%3C/svg%3E">
<style>
@font-face { font-family: Geist; src: url(/static/fonts/geist_regular.ttf); font-weight: 400; }
@font-face { font-family: Geist; src: url(/static/fonts/geist_medium.ttf); font-weight: 500; }
@font-face { font-family: Geist; src: url(/static/fonts/geist_semibold.ttf); font-weight: 600; }
@font-face { font-family: GeistMono; src: url(/static/fonts/geist_mono_medium.ttf); font-weight: 500; }
:root {
  --bg: #0A0A0B; --surface: rgba(255,255,255,.04); --surface2: rgba(255,255,255,.08);
  --plan: rgba(8,8,10,.55); --line: #1F1F23; --line2: #26262B; --repere: #2A2A30; --neutre: #4A4A52;
  --text: #F4F4F5; --muted: #A1A1AA; --dim: #8E8E96;
  --live: #F2B544; --yes: #86EFAC; --no: #FF8A80;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { --c1: #3a3a48; --c2: #26323a; }
html, body { margin: 0; color: var(--text); font: 400 14px/1.45 Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }
.mono, .label { font-family: GeistMono, ui-monospace, monospace; }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
header { position: sticky; top: 12px; z-index: 5; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; }
/* Fond vivant : un halo aux couleurs de la pochette en cours, que le verre réfracte. */
.ambient { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg); }
.ambient i { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .5; transition: background 2.5s ease; }
.ambient i:nth-child(1) { width: 60vmax; height: 60vmax; left: -15vmax; top: -25vmax; background: var(--c1); animation: flotte 38s ease-in-out infinite alternate; }
.ambient i:nth-child(2) { width: 50vmax; height: 50vmax; right: -18vmax; top: 10vh; background: var(--c2); animation: flotte 46s ease-in-out infinite alternate-reverse; }
.ambient i:nth-child(3) { width: 45vmax; height: 45vmax; left: 20vw; bottom: -30vmax; background: var(--c1); opacity: .28; animation: flotte 52s ease-in-out infinite alternate; }
@keyframes flotte { to { translate: 8vmax 6vmax; } }
@media (prefers-reduced-motion: reduce) { .ambient i { animation: none; } }
/* Verre liquide (recette Fynex validée, tranche adoucie) : éléments flottants en lentille. */
.glass, .card, .room, .lens { position: relative; background: rgb(255 255 255 / .06); border: 0 !important;
  -webkit-backdrop-filter: blur(6px) saturate(160%) brightness(1.08); backdrop-filter: var(--lens, blur(6px) saturate(160%));
  box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .12), inset 1.5px 1.5px 1px -1px rgb(255 255 255 / .4),
    inset -1.5px -1.5px 1px -1px rgb(255 255 255 / .16), inset 0 0 12px rgb(255 255 255 / .05),
    0 10px 30px -10px rgb(0 0 0 / .55), 0 1px 2px rgb(0 0 0 / .3); }
.glass::before, .card::before, .room::before, .lens::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1.5px;
  background: conic-gradient(from 0deg, rgb(255 255 255 / .18) 0deg, rgb(255 255 255 / .05) 70deg, rgb(255 255 255 / .5) 135deg,
    rgb(255 255 255 / .05) 200deg, rgb(255 255 255 / .9) 315deg, rgb(255 255 255 / .18) 360deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .4; }
/* Les grandes surfaces : verre dépoli plus calme (la lentille sur une grande carte tordrait tout le contenu). */
.glass, .card, .room { background: rgb(255 255 255 / .035); -webkit-backdrop-filter: blur(24px) saturate(150%); backdrop-filter: blur(24px) saturate(150%);
  box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .10), inset 1.5px 1.5px 1px -1px rgb(255 255 255 / .22), inset -1.5px -1.5px 1px -1px rgb(255 255 255 / .08), 0 20px 50px -20px rgb(0 0 0 / .6); }
.glass::before, .card::before, .room::before { opacity: .22; }
.row:hover { background: rgb(255 255 255 / .06) !important; }
.bar { pointer-events: auto; padding: 0 6px 0 16px; height: 52px; border-radius: 26px; display: flex; align-items: center; gap: 14px; max-width: 100%; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 17px; letter-spacing: -.02em; text-decoration: none; }
.logo small { color: var(--dim); font-weight: 400; font-size: 13px; letter-spacing: 0; }
nav { display: flex; gap: 2px; padding: 3px; border-radius: 20px; }
nav a { text-decoration: none; padding: 7px 13px; border-radius: 17px; color: var(--muted); font-weight: 500; font-size: 13px; transition: color .2s, background .2s; }
nav a:hover { color: var(--text); }
nav a.on { background: rgb(255 255 255 / .10); color: var(--text); box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .12); }
.grow { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--repere); background: transparent; cursor: pointer; font-weight: 500; font-size: 13px; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface2); }
.btn.solid { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.yes { border-color: #2f5a3d; color: var(--yes); }
.btn.no { border-color: #5a2f2f; color: var(--no); }
.btn:disabled { opacity: .4; cursor: default; }
main { max-width: 1280px; margin: 0 auto; padding: 36px 16px 64px; }
h1 { font-size: 30px !important; letter-spacing: -.03em !important; }
h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 4px; }
h2 { font-size: 16px; font-weight: 600; margin: 0; }
.sub { color: var(--muted); }
.card { border-radius: 20px; }
.list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.row { display: grid; grid-template-columns: 170px 90px 1fr 120px; gap: 16px; align-items: center; padding: 14px 16px; text-decoration: none; }
.row:hover { border-color: var(--line2); background: #141417; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
.chip.full { color: var(--text); }
.chip.drop { color: var(--live); border-color: #4a3a1c; }
.chip.yes { color: var(--yes); border-color: #2f5a3d; }
.chip.no { color: var(--no); border-color: #5a2f2f; }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); }
.top { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.back { color: var(--muted); text-decoration: none; font-size: 13px; }
.grid2 { display: grid; grid-template-columns: 1fr 320px; gap: 16px; margin-top: 16px; align-items: start; }
.panel { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.tl { padding: 12px 0 8px; }
.tlhead { display: flex; gap: 8px; align-items: center; padding: 0 16px 10px; flex-wrap: wrap; }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 19px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 15px; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 500; }
.seg button.on { background: rgb(255 255 255 / .12); color: var(--text); }
canvas { display: block; width: 100%; touch-action: pan-y; }
#overview { height: 44px; cursor: grab; }
#detail { height: 460px; cursor: crosshair; }
.hint { color: var(--dim); font-size: 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: #1c1c20; border: 1px solid var(--line2); border-radius: 8px; padding: 6px 8px; font-size: 12px; display: none; white-space: nowrap; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--dim); font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.k { color: var(--muted); white-space: nowrap; }
.ok { color: var(--yes); } .ko { color: var(--no); } .na { color: var(--dim); }
.track { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.trackhead { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.mini { height: 34px; position: relative; background: var(--plan); border: 1px solid var(--line); border-radius: 8px; }
.mini i { position: absolute; top: 4px; bottom: 4px; width: 2px; border-radius: 1px; background: var(--live); }
.mini i.off { background: var(--neutre); }
.mini i.no { background: var(--no); }
.mini b { position: absolute; top: -2px; font: 500 10px GeistMono, monospace; color: var(--muted); transform: translateX(4px); }
.sel { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-weight: 500; display: none; z-index: 20; }
.short { display: none; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--neutre); margin-right: 6px; vertical-align: 1px; }
.dot.on { background: var(--live); box-shadow: 0 0 0 3px rgba(242,181,68,.18); }
.live { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.room { position: relative; height: 300px; border-radius: 20px; overflow: hidden; }
.lamp { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 6px; transition: none; }
.lamp i { position: relative; width: 34px; height: 34px; border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--c), #fff calc(var(--f) * 60%)) 0%, var(--c) 55%, color-mix(in srgb, var(--c), #000 25%) 100%);
  box-shadow: inset 0 0 0 .75px rgb(255 255 255 / calc(.14 + var(--f) * .2)), 0 0 calc(10px + var(--f) * 22px) calc(var(--f) * 4px) color-mix(in srgb, var(--c) 70%, transparent);
  transition: background .12s linear, box-shadow .12s linear; }
.lamp i::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 30% 26%, rgb(255 255 255 / .55), transparent 45%); }
.lamp b { position: absolute; left: 50%; top: 17px; width: 260px; height: 260px; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, color-mix(in srgb, var(--c) calc(var(--f) * 32%), transparent) 0%, transparent 65%); transition: background .12s linear; z-index: -1; }
.lamp.strip i { width: 120px; height: 10px; border-radius: 5px; }
.lamp.strip i::after { border-radius: 5px; }
.lamp.strip b { width: 320px; height: 140px; }
.lamp { z-index: 1; --c: #1c1c20; --f: 0; }
.lamp span { font-size: 11px; color: var(--muted); white-space: nowrap; }
.room { background-image: radial-gradient(rgb(255 255 255 / .07) 1px, transparent 1px) !important; background-size: 22px 22px !important; }
.sofa { position: absolute; transform: translate(-50%, -50%); width: 96px; height: 28px; border: 1px solid rgb(255 255 255 / .14); border-radius: 10px; color: var(--dim); font-size: 10px; display: grid; place-items: center; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.kv div b { display: block; font: 500 22px GeistMono, monospace; margin-top: 2px; }
.meter { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--live); }
.beats { display: flex; gap: 6px; } .beats i { flex: 1; height: 8px; border-radius: 2px; background: var(--surface2); } .beats i.on { background: var(--text); }
@media (max-width: 900px) { .live { grid-template-columns: 1fr; } .room { height: 240px; } }
@media (max-width: 600px) {
  .logo { font-size: 0; gap: 0; } nav { min-width: 0; overflow-x: auto; } nav a { white-space: nowrap; }
  .bar { padding: 0 12px; gap: 8px; } nav a { padding: 6px 8px; } .long { display: none; } .short { display: inline; }
  h1 { font-size: 22px; } main { padding: 16px 12px 48px; }
}
@media (max-width: 900px) {
  .grid2 { grid-template-columns: 1fr; }
  .row { grid-template-columns: 1fr; gap: 6px; }
  #detail { height: 520px; }
  .bar { gap: 10px; } .logo small { display: none; }
}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
<header><div class="bar lens">
  <a class="logo" href="#/"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5C12 2.5 5 10.1 5 14.7a7 7 0 0 0 14 0C19 10.1 12 2.5 12 2.5Z"/></svg>Drop <small>admin</small></a>
  <nav><a href="#/direct" data-v="direct"><span class="dot" id="livedot"></span>Direct</a><a href="#/" data-v="sessions">Sessions</a><a href="#/morceaux" data-v="morceaux">Morceaux</a><a href="#/reglage" data-v="reglage">Réglage</a></nav>
  <span class="grow"></span>
  <a class="btn" id="apk" href="/apk" style="display:none"><span class="long">Télécharger l'APK</span><span class="short">APK</span></a>
</div></header>
<main id="app"></main>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
<script src="/static/glass.js"></script>
</body>
</html>
